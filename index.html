<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"><title>Reservas Barbería</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f8f9fb; }
        .card { background: white; padding: 20px; border-radius: 12px; max-width: 400px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 6px; border: 1px solid #ddd; }
        button { background: #1A237E; color: white; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Reserva tu Cita 💈</h2>
        <input type="text" id="nombre" placeholder="Nombre completo">
        <input type="tel" id="tel" placeholder="Teléfono">
        <input type="date" id="fecha">
        <select id="hora"><option value="09:00">09:00</option><option value="10:00">10:00</option><option value="11:00">11:00</option></select>
        <button onclick="enviar()">Reservar ahora</button>
    </div>
    <script>
        const _supabase = supabase.createClient('https://adtybjjcugjtgimacoyj.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFkdHliampjdWdqdGdpbWFjb3lqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MDAxMjgsImV4cCI6MjA5NTA3NjEyOH0.N8_ex2wkEWqE3g-rnjwNaQnTbRaPfjoqm2dytmGL-xA');
        async function enviar() {
            const { error } = await _supabase.from('appointments').insert([{ 
                client_name: document.getElementById('nombre').value,
                phone: document.getElementById('tel').value,
                date: document.getElementById('fecha').value,
                time: document.getElementById('hora').value,
                service: 'Corte Peluquería'
            }]);
            if (error) alert("Error: " + error.message);
            else alert("¡Cita reservada! La verás en la App al instante.");
        }
    </script>
</body>
</html>
